services:
  - type: web
    name: osint-explorer-shan467
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: CORS_ORIGINS
        value: https://shan-467.github.io
      - key: DATABASE_PATH
        value: /tmp/osint_history.db
